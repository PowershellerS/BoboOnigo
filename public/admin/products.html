<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — BoboOnigo Seller Dashboard</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a class="brand" href="/admin/index.html"><img src="/img/logo.svg" alt="BoboOnigo" class="logo"></a>
    <a href="/admin/index.html">Orders</a>
    <a href="/admin/products.html" class="active">Products</a>
    <a href="/admin/shipping.html">Shipping rates</a>
    <a href="#" id="logout-btn">Log out</a>
  </aside>
  <div class="admin-main">
    <div class="admin-toolbar">
      <h1 style="margin:0;">Products</h1>
      <button id="new-btn">+ Add product</button>
    </div>
    <div id="products-container">Loading…</div>
  </div>
</div>

<div class="modal-backdrop hidden" id="product-modal">
  <div class="modal">
    <h3 id="modal-title">Add product</h3>
    <form id="product-form">
      <input type="hidden" name="id">
      <div class="form-row"><label>Name</label><input type="text" name="name" required></div>
      <div class="form-row"><label>Description</label><textarea name="description" rows="3"></textarea></div>
      <div class="two-col">
        <div class="form-row"><label>Price (₦)</label><input type="number" name="price" min="0" required></div>
        <div class="form-row"><label>Stock</label><input type="number" name="stock" min="0" required></div>
      </div>
      <div class="form-row">
        <label>Photo</label>
        <input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif">
        <span class="small-muted" id="current-image-note"></span>
      </div>
      <div class="form-row">
        <label><input type="checkbox" name="active" checked style="width:auto;"> Active (visible in the shop)</label>
      </div>
      <p id="form-error" class="alert alert-error hidden"></p>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button type="submit">Save</button>
        <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="common.js"></script>
<script>
let PRODUCTS = [];

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadProducts() {
  const container = document.getElementById('products-container');
  container.innerHTML = 'Loading…';
  const res = await adminFetch('/api/admin/products');
  const data = await res.json();
  PRODUCTS = data.products;
  if (PRODUCTS.length === 0) {
    container.innerHTML = '<p class="small-muted">No products yet. Click "Add product" to create your first listing.</p>';
    return;
  }
  container.innerHTML = `
    <table class="data-table">
      <thead><tr><th>Photo</th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${PRODUCTS.map(p => `
          <tr>
            <td><img src="${p.image || '/img/frame-black.svg'}" alt="" style="width:56px;height:44px;object-fit:cover;border-radius:6px;"></td>
            <td>${escapeHtml(p.name)}</td>
            <td>${formatNaira(p.price)}</td>
            <td>${p.stock}</td>
            <td>${p.active ? '<span class="status-pill status-delivered">Active</span>' : '<span class="status-pill status-cancelled">Hidden</span>'}</td>
            <td>
              <button class="btn-secondary" data-action="edit" data-id="${p.id}">Edit</button>
              <button class="btn-danger" data-action="delete" data-id="${p.id}">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  container.querySelectorAll('[data-action="edit"]').forEach((btn) => {
    btn.addEventListener('click', () => openModal(PRODUCTS.find(p => p.id === parseInt(btn.dataset.id, 10))));
  });
  container.querySelectorAll('[data-action="delete"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this product? This cannot be undone.')) return;
      await adminFetch(`/api/admin/products/${btn.dataset.id}`, { method: 'DELETE' });
      loadProducts();
    });
  });
}

function openModal(product) {
  const form = document.getElementById('product-form');
  form.reset();
  document.getElementById('form-error').classList.add('hidden');
  document.getElementById('modal-title').textContent = product ? 'Edit product' : 'Add product';
  form.id.value = product ? product.id : '';
  form.name.value = product ? product.name : '';
  form.description.value = product ? product.description : '';
  form.price.value = product ? product.price : '';
  form.stock.value = product ? product.stock : '';
  form.active.checked = product ? !!product.active : true;
  document.getElementById('current-image-note').textContent = product && product.image ? 'Leave blank to keep the current photo.' : '';
  document.getElementById('product-modal').classList.remove('hidden');
}

document.getElementById('new-btn').addEventListener('click', () => openModal(null));
document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('product-modal').classList.add('hidden'));

document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const id = fd.get('id');
  const payload = {
    name: fd.get('name'),
    description: fd.get('description'),
    price: parseInt(fd.get('price'), 10),
    stock: parseInt(fd.get('stock'), 10),
    active: form.active.checked,
  };
  const file = form.image.files[0];
  if (file) {
    payload.imageDataUrl = await fileToDataUrl(file);
  }

  const errorEl = document.getElementById('form-error');
  errorEl.classList.add('hidden');
  try {
    const res = await adminFetch(id ? `/api/admin/products/${id}` : '/api/admin/products', {
      method: id ? 'PUT' : 'POST',
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Could not save product.';
      errorEl.classList.remove('hidden');
      return;
    }
    document.getElementById('product-modal').classList.add('hidden');
    loadProducts();
  } catch {
    errorEl.textContent = 'Network error — please try again.';
    errorEl.classList.remove('hidden');
  }
});

async function init() {
  const session = await requireAdminAuth();
  if (!session) return;
  wireLogout();
  loadProducts();
}
init();
</script>
</body>
</html>
