<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — BoboOnigo</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/"><img src="/img/logo.svg" alt="BoboOnigo" class="logo"></a>
  <nav class="nav-actions">
    <a class="cart-link" href="/cart.html">Cart <span class="cart-count" id="cart-count">0</span></a>
  </nav>
</header>

<main>
  <p><a href="/">&larr; Back to shop</a></p>
  <div id="content">Loading…</div>
</main>

<footer class="site-footer">BoboOnigo &middot; <a href="/admin/login.html">Seller login</a></footer>

<script src="/js/cart.js"></script>
<script>
const params = new URLSearchParams(location.search);
const productId = parseInt(params.get('id'), 10);

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load() {
  const content = document.getElementById('content');
  if (!productId) { content.innerHTML = '<p class="alert alert-error">No product specified.</p>'; return; }
  try {
    const res = await fetch(`/api/products/${productId}`);
    if (!res.ok) { content.innerHTML = '<p class="alert alert-error">Product not found.</p>'; return; }
    const { product } = await res.json();
    render(product);
  } catch {
    content.innerHTML = '<p class="alert alert-error">Could not load this product.</p>';
  }
}

function render(p) {
  const content = document.getElementById('content');
  const outOfStock = p.stock <= 0;
  content.innerHTML = `
    <div class="product-detail">
      <img src="${p.image || '/img/frame-black.svg'}" alt="${escapeHtml(p.name)}">
      <div>
        <h1>${escapeHtml(p.name)}</h1>
        <div class="price" style="font-size:1.4rem;">${formatNaira(p.price)}</div>
        <p>${escapeHtml(p.description || '')}</p>
        ${outOfStock
          ? '<p class="alert alert-error">Out of stock</p>'
          : (p.stock <= 5 ? `<p class="stock-note low">Only ${p.stock} left in stock</p>` : '')}
        <div class="qty-row">
          <label for="qty">Qty</label>
          <input type="number" id="qty" value="1" min="1" max="${Math.max(1, p.stock)}" ${outOfStock ? 'disabled' : ''}>
        </div>
        <button id="add-btn" ${outOfStock ? 'disabled' : ''}>${outOfStock ? 'Out of stock' : 'Add to cart'}</button>
        <p id="added-msg" class="small-muted hidden">Added to cart. <a href="/cart.html">View cart &rarr;</a></p>
      </div>
    </div>
  `;
  const btn = document.getElementById('add-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      const qty = Math.max(1, parseInt(document.getElementById('qty').value, 10) || 1);
      addToCart(p.id, qty);
      document.getElementById('added-msg').classList.remove('hidden');
    });
  }
}

load();
</script>
</body>
</html>
